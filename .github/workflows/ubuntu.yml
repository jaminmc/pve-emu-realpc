name: 3.Build Ubuntu qemu anti detection binary

on:
  push:
    branches:
      - master
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      TZ: Asia/Shanghai
    steps:
      # Step 0: Install git
      - name: 0-Install git
        run: |
          sudo apt update
          sudo apt install -y git
          
      # Step 1: Checkout code
      - name: 1-checkout
        uses: actions/checkout@v3
        with:  
          submodules: 'true'

      # Step 2: Install required build packages
      - name: 2-Install base package
        run: |
          uname -a
          sudo apt install build-* bc dosfstools iasl mtools nasm \
          python3 python3-pexpect qemu-utils uuid-dev xorriso curl -y

      # Step 3: Build binary files
      - name: 3-Build
        run: |
          
          sudo bash build_debain_qemu.sh
          mkdir -p artifacts
          find ./ -name "qemu-system-x86_64" -exec cp {} ./artifacts/ \;
          find ./ -name "bios*.bin" -exec cp {} ./artifacts/ \;
          find ./ -name "vgabios-s*.bin" -exec cp {} ./artifacts/ \;
          find ./ -name "vgabios-q*.bin" -exec cp {} ./artifacts/ \;
          find ./ -name "efi-e1*.rom" -exec cp {} ./artifacts/ \;
          find ./ -name "efi-vi*.rom" -exec cp {} ./artifacts/ \;
          find ./ -name "*autoGenPatch.patch" -exec cp {} ./artifacts/ \;
          find ./ -name "*.aml" -exec cp {} ./artifacts/ \;
          

      # Step 4: Upload artifacts
      - name: 4-Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-qemu
          path: artifacts/*

      # Step 5: Get current time
      - name: 5-Get current time
        id: current-time
        uses: josStorer/get-current-time@v2.0.2
        with:
          format: YYYYMMDD-HHmmSS
          utcOffset: "+08:00"

      # Step 6: List files in artifacts directory
      - name: 6-List artifacts directory
        run: |
          echo "Listing files in artifacts directory:"
          ls -l artifacts/
          cd artifacts
          

      # Step 7: Create GitHub Release
      - name: 7-Create GitHub Releases
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ format('v{0}-ubuntu', steps.current-time.outputs.formattedTime) }}
          release_name: ${{ format('v10.x build-{0} for ubuntu24', steps.current-time.outputs.formattedTime) }}
          body: |
            build Ubuntu qemu form v10.1 to v10.x.
            support UEFI and Seabios,Virtual Machine Manager BIOS is UEFI better!
            `sudo apt-get install virt-manager seabios ovmf`
            `sudo cp qemu-system-x86_64 /usr/bin/`
            `sudo cp {bios-256k.bin,bios.bin,efi-e1000.rom,efi-e1000e.rom,vgabios-qxl.bin,vgabios-stdvga.bin,efi-virtio.rom} /usr/share/qemu/`
            `sudo apt-get install libsndio7.0`
            `qemu-system-x86_64 --version`
            `qemu-system-x86_64`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 8: Upload files to Release
      - name: 8-Upload each deb file to release
        run: |
          for file in ${GITHUB_WORKSPACE}/artifacts/*; do
            echo "Uploading $file"
            echo "file=$file" >> $GITHUB_ENV
            # Call upload action
            curl -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.create_release.outputs.id }}/assets?name=$(basename $file)"
          done
